<section id="features" class="features">
  <h2>Features</h2>
  <div class="features-grid">
    <div class="feature">Latest Releases</div>
    <div class="feature">Community Reviews</div>
    <div class="feature">Live Streams</div>
  </div>
</section>

<section id="games" class="games">
  <h2>Top Picks</h2>
  <div class="cards">
    <article class="card">
      <img src="https://picsum.photos/seed/game1/400/220" alt="Game 1 screenshot" />
      <h3>Neon Assault</h3>
      <p>Fast-paced shooter with neon visuals.</p>
      <button class="btn small" data-game="Neon Assault">Details</button>
    </article>

    <article class="card">
      <img src="https://picsum.photos/seed/game2/400/220" alt="Game 2 screenshot" />
      <h3>Sky Realms</h3>
      <p>Open-world adventure among floating islands.</p>
      <button class="btn small" data-game="Sky Realms">Details</button>
    </article>

    <article class="card">
      <img src="https://picsum.photos/seed/game3/400/220" alt="Game 3 screenshot" />
      <h3>Rift Racers</h3>
      <p>High-speed racing with crazy tracks.</p>
      <button class="btn small" data-game="Rift Racers">Details</button>
    </article>
  </div>
</section>

<section id="contact" class="contact">
  <h2>Contact</h2>
  <form id="contactForm">
    <input type="text" name="name" placeholder="Your name" required />
    <input type="email" name="email" placeholder="Email" required />
    <textarea name="message" rows="4" placeholder="Message"></textarea>
    <button class="btn" type="submit">Send</button>
  </form>
</section>
